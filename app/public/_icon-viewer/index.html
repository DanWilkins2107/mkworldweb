<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MKW Icon Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e;
      color: #eee;
      margin: 0;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p.meta { margin: 0 0 8px; color: #aaa; font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 12px;
    }
    .tile {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      line-height: 1.3;
    }
    .tile.mapped { border-color: #4a7; background: #1f2f24; }
    .tile.dup { border-color: #d44; background: #2f1f1f; }
    .tile img { width: 100%; height: auto; display: block; margin-bottom: 6px; }
    .code { color: #ccc; font-weight: 600; }
    .slug { color: #6cf; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .slug.dup { color: #f88; }
    .legend { color: #aaa; font-size: 12px; margin: 4px 0 18px; }
    .legend span { display: inline-block; padding: 2px 8px; border-radius: 4px; margin-right: 8px; }
    .legend .ok { background: #1f2f24; border: 1px solid #4a7; }
    .legend .bad { background: #2f1f1f; border: 1px solid #d44; }
    button { background: #444; color: #eee; border: 1px solid #666; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #555; }
  </style>
</head>
<body>
  <h1>MKW Icon Viewer</h1>
  <p class="meta">All 164 NSO icons. Slugs come from <code>app/public/avatar-map.json</code> — edit that file and click reload.</p>
  <div class="legend">
    <span class="ok">mapped</span>
    <span class="bad">duplicate (slug used in 2+ tiles)</span>
    <button onclick="location.reload()">Reload</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    async function render() {
      const res = await fetch("../avatar-map.json", { cache: "no-store" });
      const map = await res.json(); // { slug: "MKWcNNN.png" | null }
      const fileToSlugs = {};
      for (const [slug, file] of Object.entries(map)) {
        if (!file) continue;
        (fileToSlugs[file] ??= []).push(slug);
      }
      const grid = document.getElementById("grid");
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= 164; i++) {
        const code = "MKWc" + String(i).padStart(3, "0");
        const file = code + ".png";
        const slugs = fileToSlugs[file] || [];
        const tile = document.createElement("div");
        const dup = slugs.length > 1;
        tile.className = "tile" + (slugs.length ? (dup ? " dup" : " mapped") : "");
        tile.innerHTML =
          '<img src="' + file + '" loading="lazy" />' +
          '<div class="code">' + code + '</div>' +
          (slugs.length
            ? '<div class="slug' + (dup ? ' dup' : '') + '">→ ' + slugs.join(", ") + '</div>'
            : '');
        frag.appendChild(tile);
      }
      grid.replaceChildren(frag);
    }
    render().catch(err => {
      document.body.insertAdjacentHTML("beforeend", "<pre style='color:#f88'>Failed to load map.json: " + err + "</pre>");
    });
  </script>
</body>
</html>
