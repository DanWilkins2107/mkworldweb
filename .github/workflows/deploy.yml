name: Deploy

# Only ever runs on trusted refs. Deliberately NOT triggered by `pull_request`:
# fork PRs would otherwise get a runner with access to the deploy credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. `id-token` is only needed if you later switch to Workload
# Identity Federation; drop it if you stay on a service-account key.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - run: npm ci
      - run: npm ci --prefix app

      # Writes the key to a temp file outside the workspace and exports
      # GOOGLE_APPLICATION_CREDENTIALS; the file is removed in a post step.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Firebase Web SDK config is public by design - Vite inlines it into the
      # client bundle, so it is readable from the deployed site either way.
      # Access is enforced by firebase/database.rules.json, not by hiding these.
      - name: Build and deploy
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCFRI-cfO8fzSc0YUICbLmeUmYFZk-pX7E
          VITE_FIREBASE_AUTH_DOMAIN: softwire-mkworld-tournament.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://softwire-mkworld-tournament-default-rtdb.europe-west1.firebasedatabase.app
          VITE_FIREBASE_PROJECT_ID: softwire-mkworld-tournament
          VITE_FIREBASE_APP_ID: 1:275302891583:web:b9024cddc40207ada0b88a
        run: npm run deploy -- --non-interactive
